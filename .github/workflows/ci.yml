name: ci


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Aclippy::type_complexity" # Ignorar la advertencia de complejidad de tipos en el código de la base de datos
 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
      working-directory: DARG
    - name: Run tests
      run: cargo test --verbose
      working-directory: DARG
    - name: Run clippy
      run: cargo clippy --all-targets --all-features
      working-directory: DARG
