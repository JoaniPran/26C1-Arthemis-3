name: "Rust_Cargo_Pipeline"
tasks:

  - name: "Crear una carpeta para el proyecto"
    command: "mkdir -p /home/Proyectos-externos"
    depends_on: []
    
  - name: "Clonar repositorio"
    command: "cd/home/Proyectos-externos && git clone https://github.com/JoaniPran/MiniKV-Server.git"
    depends_on: []

  - name: "Formatear código"
    command: "cd MiniKV-Server && cargo fmt"
    depends_on: ["Clonar repositorio"]

  - name: "Testear Codigo"
    command: "cd MiniKV-Server && cargo test"
    depends_on: ["Formatear código"]

  - name: "Mostrar resultados"
    command: "echo 'Mostrando resultados de los tests...' && echo 'All tests passed!'"
    depends_on: ["Testear Codigo"]