name: "Rust_Concurrency_Stress_Test_Distribuido"
tasks:
  - name: "Clonar_Repositorio"
    command: "git clone https://github.com/JoaniPran/MiniKV-Server.git"
    depends_on: []
    produces: "MiniKV-Server" 

  - name: "Validar_Formato"
    command: "cd MiniKV-Server && cargo fmt"
    depends_on: ["Clonar_Repositorio"]
    consumes: ["Clonar_Repositorio"] 

  - name: "Analisis_Estatico_Clippy"
    command: "cd MiniKV-Server && cargo clippy -- -D warnings"
    depends_on: ["Clonar_Repositorio"]
    consumes: ["Clonar_Repositorio"]

  - name: "Ejecutar_Tests"
    command: "cd MiniKV-Server && cargo test"
    depends_on: ["Clonar_Repositorio"]
    consumes: ["Clonar_Repositorio"]

  - name: "Auditar_Seguridad_Worker"
    command: "echo 'Verificando estado del Worker...' && cargo --version"
    depends_on: []

  - name: "Mostrar_Resultados_Finales"
    command: "echo '¡Validación de concurrencia exitosa! Todo el Pipeline de MiniKV pasó las pruebas.'"
    depends_on: ["Validar_Formato", "Analisis_Estatico_Clippy", "Ejecutar_Tests"]