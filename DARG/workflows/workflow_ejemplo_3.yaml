name: "Java_Maven_Parallel_Pipeline"
tasks:
  - name: "Clonar repositorio"
    command: "git clone https://github.com/JoaniPran/TaylorSwift.git output"
    depends_on: []

  - name: "Ejecutar Tests Unitarios"
    command: "cd output && mvn test"
    depends_on: ["Clonar repositorio"]

  - name: "Generar Documentacion Javadoc"
    command: "cd output && mvn javadoc:javadoc"
    depends_on: ["Clonar repositorio"]

  - name: "Deploy"
    command: "echo '¡Todos los chequeos en paralelo pasaron con éxito! Desplegando aplicación...'"
    depends_on: ["Ejecutar Tests Unitarios", "Generar Documentacion Javadoc"]